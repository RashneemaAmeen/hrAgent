[build]
  command = "npm install --prefix frontend --no-audit --no-fund && npm run build --prefix frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
